name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  build-ubuntu:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build Ubuntu executable
        run: npx pkg bridge/host.js --targets node18-linux-x64 --out-path dist
      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          src=$(find dist -maxdepth 1 -type f -name "host*" | head -1)
          test -n "$src"
          mv "$src" dist/ds-pwsh-bridge-ubuntu-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ds-pwsh-bridge-ubuntu-x64
          path: browser-extension/dist/ds-pwsh-bridge-ubuntu-x64

  build-arch:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Install build tools
        run: pacman -Sy --noconfirm nodejs npm git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Build Arch Linux executable
        run: npx pkg bridge/host.js --targets node18-linux-x64 --out-path dist
      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          src=$(find dist -maxdepth 1 -type f -name "host*" | head -1)
          test -n "$src"
          mv "$src" dist/ds-pwsh-bridge-arch-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ds-pwsh-bridge-arch-x64
          path: browser-extension/dist/ds-pwsh-bridge-arch-x64

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build Windows executable
        run: npx pkg bridge/host.js --targets node18-win-x64 --out-path dist
      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          src=$(find dist -maxdepth 1 -type f -name "host*" | head -1)
          test -n "$src"
          mv "$src" dist/ds-pwsh-bridge-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ds-pwsh-bridge-win-x64.exe
          path: browser-extension/dist/ds-pwsh-bridge-win-x64.exe

  release:
    needs: [build-ubuntu, build-arch, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require(\"./browser-extension/package.json\").version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DS-pwsh bridge ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

